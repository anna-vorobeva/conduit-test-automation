server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA: client-side routes (/login, /editor, ...) fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API: proxy to the backend container, so the browser never deals with CORS
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
